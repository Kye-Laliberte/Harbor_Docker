services:
  postgres:
    image: postgres:16
    container_name: harbor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - harbor_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s 
      

  api:
    build: .
    container_name: harbor-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; request = urllib.request.Request('http://localhost:8000/', headers={'X-API-Key': os.environ.get('API_KEY', '')}); urllib.request.urlopen(request, timeout=3).close()"
      interval: 2s
      timeout: 4s
      retries: 12
      start_period: 10s

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      API_KEY: ${API_KEY:?API_KEY is required}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}

    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
    depends_on:
      postgres:
        condition: service_healthy

  postman-tests:
    image: postman/newman:alpine
    profiles: [test]
    restart: "no"
    environment:
      API_KEY: ${API_KEY}
      BASE_URL: http://api:8000
    volumes:
      - "./postman/Harbor API.postman_collection.json:/etc/newman/collection.json:ro"
      - ./postman/run-newman.sh:/etc/newman/run-newman.sh:ro
    entrypoint: ["/bin/sh", "/etc/newman/run-newman.sh"]
    
    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 2s
      timeout: 6s
      retries: 4
      start_period: 10s

volumes:
  harbor_data:
